global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'burntbeats-prod'
    region: 'us-east-1'

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s

  - job_name: 'midi_service'
    static_configs:
      - targets: ['midi_service:5002']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']
