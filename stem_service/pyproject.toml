[project]
name = "burntbeats-stem"
version = "1.0.0"
description = "Burnt Beats CPU stem separation service (Demucs / MDX / hybrid)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "burntbeats-common",
    "torch>=2.13.0,<2.14",
    "torchaudio>=2.0.0,<2.13",
    "soundfile>=0.12.0",
    "imageio-ffmpeg>=0.4.0",
    "demucs>=4.0.0",
    "diffq>=0.2.0",
    "onnxruntime>=1.14.0",
    "numpy>=1.24.0,<2.6",
    "scipy>=1.9.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "python-multipart>=0.0.32",
    "boto3>=1.28.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "pyyaml>=6.0",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "requests>=2.33.0",
    "httpx>=0.23.0,<0.28.0",
]

[tool.uv]
package = false

[tool.uv.sources]
burntbeats-common = { workspace = true }
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
