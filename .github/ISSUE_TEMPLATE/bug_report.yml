name: Bug report
description: Something broken on burntbeats.com or in local dev
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Include steps to reproduce — it helps a solo maintainer fix things faster.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Sign in as Basic\n2. Upload MP3\n3. Split 4-stem..."
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: "Chrome 131 / Windows 11"
  - type: dropdown
    id: plan
    attributes:
      label: Plan (if signed in)
      options:
        - Free / welcome grant
        - Basic
        - Premium
        - Studio
        - Pack only
        - Not signed in
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
    validations:
      required: true
