name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Frontend ESLint
        working-directory: frontend
        run: npm run lint
      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend build
        working-directory: frontend
        run: npm run build
      - name: Frontend critical unit tests
        working-directory: frontend
        run: npm run test:run -- src/utils/tokenCost.test.ts src/hooks/useExport.test.ts
      - name: Frontend MIDI hardening tests
        working-directory: frontend
        run: npm run test:run -- src/hooks/useMidiConvert.test.ts src/hooks/useMidiHistory.test.ts src/components/MyStemsPage.test.tsx
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke (app + legal pages)
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: true

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Backend npm audit
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Backend lint
        working-directory: backend
        run: npm run lint
      - name: Backend health smoke
        working-directory: backend
        run: |
          set -euo pipefail
          export PORT=3001
          export STEM_SERVICE_URL=http://localhost:5000
          node server.js &
          pid=$!
          trap "kill $pid >/dev/null 2>&1 || true" EXIT
          sleep 2
          curl -fsS http://localhost:3001/api/health | cat
      - name: Backend MIDI hardening tests
        working-directory: backend
        run: |
          node --test \
            server.test.js \
            tests/auth-gates.test.mjs \
            tests/midi-auth.test.mjs \
            tests/midi-storage-health.test.mjs \
            tests/midi-convert-validation.test.mjs \
            tests/midi-status-auth.test.mjs

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Verify uv.lock is up to date
        run: uv lock --check
      - name: Python syntax smoke
        run: |
          uv sync --frozen --package burntbeats-stem --no-install-project
          uv sync --frozen --group dev
          uv run ruff check stem_service --select E9,F63,F7,F82 --quiet
          uv run python -m py_compile stem_service/server.py
      - name: Python stem dependency smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1
          uv sync --frozen --package burntbeats-stem --no-install-project
          uv run python -c "from stem_service.config import scnet_available; print('scnet_available', scnet_available())"
      - name: Torchaudio I/O smoke
        run: uv run python scripts/smoke_torchaudio_io.py
      - name: Stem service unit tests
        env:
          STEM_ALLOW_MISSING_HTDEMUCS: "1"
        run: uv run pytest stem_service/tests -q

  midi-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install midi_service test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 ffmpeg
          uv sync --frozen --package burntbeats-midi --no-install-project
          uv sync --frozen --group dev
      - name: MIDI service unit tests
        run: uv run pytest midi_service/tests -q -m "not integration"

  stem-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build stem_service image
        run: docker build -f stem_service/Dockerfile .

  backend-docker-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image (clean context)
        run: docker build -t burntbeats-backend:latest -f backend/Dockerfile backend
      - name: Verify backend production deps in container
        run: |
          set -euo pipefail
          cid="$(docker create burntbeats-backend:latest)"
          trap "docker rm -f \"$cid\" >/dev/null 2>&1 || true" EXIT
          docker cp "$cid:/app/package.json" /tmp/backend-package.json
          docker cp "$cid:/app/node_modules/@clerk/express/package.json" /tmp/clerk-express.json
          docker cp "$cid:/app/node_modules/multer/package.json" /tmp/multer.json
          node -e "const p=require('/tmp/backend-package.json'); const c=require('/tmp/clerk-express.json').version; const m=require('/tmp/multer.json').version; const semver=(range,v)=>range.replace(/^[~^]/,'').split('.').slice(0,2).join('.')===v.split('.').slice(0,2).join('.'); if(!semver(p.dependencies['@clerk/express'],c)){console.error('clerk version mismatch',p.dependencies['@clerk/express'],c); process.exit(1);} if(!semver(p.dependencies['multer'],m)){console.error('multer version mismatch',p.dependencies['multer'],m); process.exit(1);} console.log('backend docker deps OK:',c,m);"

