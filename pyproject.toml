[project]
name = "burntbeats"
version = "0.0.0"
description = "Burnt Beats monorepo — Python workspace root (stem, speech, MIDI services)"
requires-python = ">=3.11,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["stem_service", "midi_service", "speech_service", "shared/python"]

# basic-pitch declares TensorFlow on non-Darwin; burntbeats-midi uses ONNX only (see midi_service/services/model_runtime.py).
[tool.uv]
override-dependencies = [
  "tensorflow==2.15.0; python_version < '0'",
  "tensorflow-macos==2.15.0; python_version < '0'",
  "tensorflow-estimator==2.15.0; python_version < '0'",
  "tensorflow-io-gcs-filesystem==0.37.1; python_version < '0'",
  "keras==2.15.0; python_version < '0'",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.23.0,<0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:xonsh"
markers = [
    "integration: marks tests that require Basic Pitch installed (deselect with '-m \"not integration\"')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-width = 4

[tool.pyrefly]
search_path = [
    ".venv/lib/python3.11/site-packages",
    ".venv/lib/python3.12/site-packages",
    ".",
]
source_path = ["."]
python_version = "3.11"
