services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Leave unset for same-origin API calls (nginx proxies /api/ → backend). Do NOT use
        # http://backend:3001 here — that hostname only exists inside the Compose network;
        # the browser would fail to resolve it. Optional: set to your public https:// origin.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
        VITE_STRIPE_PRICING_TABLE_ID: ${VITE_STRIPE_PRICING_TABLE_ID:-}
        VITE_STRIPE_CUSTOMER_PORTAL_URL: ${VITE_STRIPE_CUSTOMER_PORTAL_URL:-}
        VITE_GA_MEASUREMENT_ID: ${VITE_GA_MEASUREMENT_ID:-}
        VITE_FULL_PRICING_URL: ${VITE_FULL_PRICING_URL:-}
        VITE_STRIPE_PACKAGE_PRICING_TABLE_ID: ${VITE_STRIPE_PACKAGE_PRICING_TABLE_ID:-}
        # Sentry APM (baked into the Vite bundle at build time)
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-production}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
        # Source map upload (requires auth token at build time)
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN:-}
        SENTRY_ORG: ${SENTRY_ORG:-}
        SENTRY_PROJECT: ${SENTRY_PROJECT:-}
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      stem_service:
        condition: service_healthy
      speech_service:
        condition: service_healthy
      midi_service:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      # Absolute https base for stem URLs in JSON (avoids http:// links when proxies omit X-Forwarded-Proto).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      STEM_SERVICE_URL: http://stem_service:5000
      SPEECH_SERVICE_URL: http://speech_service:5001
      MIDI_SERVICE_URL: http://midi_service:5002
      MIDI_ACCEPT_TIMEOUT_MS: ${MIDI_ACCEPT_TIMEOUT_MS:-60000}
      STEM_OUTPUT_DIR: /app/tmp/stems
      SPEECH_OUTPUT_DIR: /app/tmp/speech
      SPEECH_MAX_UPLOAD_MB: ${SPEECH_MAX_UPLOAD_MB:-100}
      MIDI_OUTPUT_DIR: /app/tmp/midi
      STEM_SERVICE_API_TOKEN: ${STEM_SERVICE_API_TOKEN:-}
      SPEECH_SERVICE_API_TOKEN: ${SPEECH_SERVICE_API_TOKEN:-}
      MIDI_SERVICE_API_TOKEN: ${MIDI_SERVICE_API_TOKEN:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost}
      REDIS_URL: ${REDIS_URL:-}
      # PostgreSQL (AWS RDS)
      DATABASE_URL: ${DATABASE_URL:-}
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-20}
      DB_IDLE_TIMEOUT: ${DB_IDLE_TIMEOUT:-30000}
      DB_CONNECTION_TIMEOUT: ${DB_CONNECTION_TIMEOUT:-5000}
      DB_MAX_USES: ${DB_MAX_USES:-7500}
      DB_QUERY_TIMEOUT: ${DB_QUERY_TIMEOUT:-30000}
      DB_STATEMENT_TIMEOUT: ${DB_STATEMENT_TIMEOUT:-30000}
      API_KEY: ${API_KEY:-}
      JOB_TOKEN_SECRET: ${JOB_TOKEN_SECRET:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      # Dashboard → Webhooks → signing secret (Svix). Required for welcome-token grants on user.created.
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_ID_BASIC: ${STRIPE_PRICE_ID_BASIC:-}
      STRIPE_PRICE_ID_PREMIUM: ${STRIPE_PRICE_ID_PREMIUM:-}
      STRIPE_PRICE_ID_STUDIO: ${STRIPE_PRICE_ID_STUDIO:-}
      STRIPE_PRICE_ID_TOPUP: ${STRIPE_PRICE_ID_TOPUP:-}
      STRIPE_PRICE_ID_SINGLE: ${STRIPE_PRICE_ID_SINGLE:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_PREFIX: ${S3_PREFIX:-stems}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      S3_PRESIGN_EXPIRES_SECONDS: ${S3_PRESIGN_EXPIRES_SECONDS:-3600}
      USAGE_TOKENS_ENABLED: ${USAGE_TOKENS_ENABLED:-1}
      USAGE_DEFAULT_TOKENS_PER_MONTH: ${USAGE_DEFAULT_TOKENS_PER_MONTH:-6000}
      USAGE_SIGNUP_WELCOME_TOKENS: ${USAGE_SIGNUP_WELCOME_TOKENS:-}
      DEV_BYPASS_UPLOAD_AUTH: ${DEV_BYPASS_UPLOAD_AUTH:-0}
      # Sentry APM
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ./tmp/stems:/app/tmp/stems
      - ./tmp/speech:/app/tmp/speech
      - ./tmp/midi:/app/tmp/midi
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "import http from 'http'; http.get('http://localhost:3001/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  stem_service:
    build:
      context: .
      dockerfile: stem_service/Dockerfile
    # Optional tuning / pipeline flags (copy from stem_service/.env.example). Missing file is OK.
    # Precedence: keys listed under environment: below override the same key from this file.
    env_file:
      - path: stem_service/.env
        required: false
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Production EC2: set STEM_MODELS_DIR=server_models in root .env and ship only `server_models/`
      # (built via scripts/export_server_models.py from canonical `models/`). Default `models` is OK for dev.
      STEM_MODELS_DIR: ${STEM_MODELS_DIR:-models}
      STEM_OUTPUT_DIR: /repo/tmp/stems
      STEM_SERVICE_API_TOKEN: ${STEM_SERVICE_API_TOKEN:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost}
      # One CPU budget surface for queue workers + per-job threads.
      STEM_CPU_WORKERS: ${STEM_CPU_WORKERS:-1}
      STEM_CPU_THREADS: ${STEM_CPU_THREADS:-2}
      STEM_CPU_INTEROP_THREADS: ${STEM_CPU_INTEROP_THREADS:-1}
      S3_ENABLED: ${S3_ENABLED:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-stems}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_DELETE_LOCAL_AFTER_UPLOAD: ${S3_DELETE_LOCAL_AFTER_UPLOAD:-false}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Sentry APM (separate DSN for stem service)
      SENTRY_DSN: ${SENTRY_DSN_STEM:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ./tmp/stems:/repo/tmp/stems
      - ./models:/repo/models
      - ./server_models:/repo/server_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "2.0"

  speech_service:
    build:
      context: .
      dockerfile: speech_service/Dockerfile
    ports:
      - "127.0.0.1:5001:5001"
    environment:
      SPEECH_MODELS_DIR: /repo/speech_models
      SPEECH_OUTPUT_DIR: /repo/tmp/speech
      SPEECH_DEVICE: ${SPEECH_DEVICE:-cpu}
      SPEECH_MAX_UPLOAD_MB: ${SPEECH_MAX_UPLOAD_MB:-100}
      SPEECH_SERVICE_API_TOKEN: ${SPEECH_SERVICE_API_TOKEN:-}
      INTERNAL_SERVICE_AUTH_REQUIRED: "1"
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost}
    volumes:
      - ./tmp/speech:/repo/tmp/speech
      - ./speech_models:/repo/speech_models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  midi_service:
    build:
      context: .
      dockerfile: midi_service/Dockerfile
    ports:
      - "127.0.0.1:5002:5002"
    environment:
      MIDI_OUTPUT_DIR: /repo/tmp/midi
      MIDI_SERVICE_API_TOKEN: ${MIDI_SERVICE_API_TOKEN:-}
      INTERNAL_SERVICE_AUTH_REQUIRED: "1"
      MIDI_MAX_QUEUE_DEPTH: ${MIDI_MAX_QUEUE_DEPTH:-8}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:5173,http://localhost}
    volumes:
      - ./tmp/midi:/repo/tmp/midi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  cleanup:
    build:
      context: ./docker/cleanup
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:3001
      API_KEY: ${API_KEY:-}
      STEM_MAX_AGE_HOURS: ${STEM_CLEANUP_MAX_AGE_HOURS:-48}
      MIDI_MAX_AGE_HOURS: ${MIDI_CLEANUP_MAX_AGE_HOURS:-24}
      SPEECH_MAX_AGE_HOURS: ${SPEECH_CLEANUP_MAX_AGE_HOURS:-48}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-6}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.1"
